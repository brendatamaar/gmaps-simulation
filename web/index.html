<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jakarta Router — Directions</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: "Roboto", "Segoe UI", system-ui, Arial, sans-serif;
        color: #202124;
        background: #e8eaed;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #map {
        position: absolute;
        inset: 0;
        cursor: default;
      }
      .maplibregl-ctrl-attrib {
        font-size: 10px;
      }

      /* ── Toolbar ─────────────────────────────────────────────────────── */
      #toolbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 3;
        height: 60px;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 16px;
        background: #fff;
        border-bottom: 1px solid #dadce0;
        box-shadow:
          0 1px 2px rgba(60, 64, 67, 0.15),
          0 2px 6px rgba(60, 64, 67, 0.1);
      }

      .tb-brand {
        flex: none;
        font-size: 15px;
        font-weight: 600;
        white-space: nowrap;
      }

      /* Mode selector — segmented pill control */
      .modes-group {
        display: flex;
        flex: none;
        background: #f1f3f4;
        border-radius: 10px;
        padding: 3px;
        gap: 2px;
      }
      #modes button {
        padding: 7px 10px;
        border: none;
        background: transparent;
        cursor: pointer;
        color: #5f6368;
        font-size: 13px;
        white-space: nowrap;
        border-radius: 8px;
        font-family: inherit;
        transition:
          background 0.15s,
          color 0.15s,
          box-shadow 0.15s;
      }
      #modes button:hover:not(.active) {
        background: rgba(0, 0, 0, 0.05);
        color: #3c4043;
      }
      #modes button.active {
        background: #fff;
        color: #1a73e8;
        font-weight: 500;
        box-shadow:
          0 1px 3px rgba(60, 64, 67, 0.25),
          0 0 0 1px rgba(60, 64, 67, 0.08);
      }

      /* Origin / destination fields, laid out inline in the toolbar */
      .tb-fields {
        flex: 1 1 auto;
        min-width: 0;
        max-width: 640px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dot {
        width: 10px;
        height: 10px;
        flex: none;
      }
      .dot.o {
        background: #34a853;
        border-radius: 50%;
      }
      .dot.d {
        background: #ea4335;
        border-radius: 2px;
      }
      .tb-fields-inputs {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      /* Search inputs */
      .field-input {
        flex: 1;
        min-width: 0;
        width: 100%;
        padding: 8px 10px;
        background: #f1f3f4;
        border: 1.5px solid transparent;
        border-radius: 8px;
        font-size: 13px;
        font-family: inherit;
        color: #3c4043;
        outline: none;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .field-input::placeholder {
        color: #80868b;
      }
      .field-input:focus {
        background: #fff;
        border-color: #1a73e8;
      }

      /* Suggestion dropdown — fixed-positioned via JS to escape toolbar overflow */
      .suggestions {
        position: fixed;
        background: #fff;
        border-radius: 10px;
        box-shadow:
          0 4px 12px rgba(60, 64, 67, 0.25),
          0 1px 3px rgba(60, 64, 67, 0.15);
        z-index: 100;
        overflow: hidden;
      }
      .suggestions[hidden] {
        display: none;
      }
      .sugg-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        cursor: pointer;
        font-size: 13px;
        transition: background 0.1s;
      }
      .sugg-item:hover,
      .sugg-item.active {
        background: #f1f3f4;
      }
      .sugg-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex: none;
        align-self: flex-start;
        margin-top: 4px;
      }
      .sugg-text {
        flex: 1;
        min-width: 0;
      }
      .sugg-name {
        color: #202124;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sugg-name strong {
        font-weight: 600;
        color: #1a73e8;
      }
      .sugg-addr {
        color: #80868b;
        font-size: 11px;
        margin-top: 1px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sugg-kind {
        color: #80868b;
        font-size: 11px;
        white-space: nowrap;
        flex: none;
        align-self: flex-start;
        margin-top: 2px;
      }
      .swap-btn {
        background: #f1f3f4;
        border: none;
        border-radius: 50%;
        width: 28px;
        height: 28px;
        cursor: pointer;
        font-size: 15px;
        color: #5f6368;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .swap-btn:hover {
        background: #e8f0fe;
        color: #1a73e8;
      }

      /* Right-hand toolbar actions: settings, calculate, clear */
      .tb-actions {
        flex: none;
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: auto;
      }
      .icon-btn {
        width: 36px;
        height: 36px;
        flex: none;
        border: none;
        border-radius: 50%;
        background: #f1f3f4;
        color: #5f6368;
        font-size: 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .icon-btn:hover {
        background: #e8eaed;
        color: #3c4043;
      }
      .icon-btn.active {
        background: #e8f0fe;
        color: #1a73e8;
      }
      #clear {
        color: #c5221f;
      }
      #clear:hover {
        background: #fce8e8;
      }

      .settings-wrap {
        position: relative;
        flex: none;
      }
      .settings-panel {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        width: 280px;
        background: #fff;
        border-radius: 12px;
        box-shadow:
          0 2px 6px rgba(60, 64, 67, 0.3),
          0 6px 20px rgba(60, 64, 67, 0.2);
        padding: 14px 16px;
        z-index: 4;
      }
      .settings-panel[hidden] {
        display: none;
      }

      /* Departure controls (inside the settings dropdown) */
      .time-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .time-label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: #5f6368;
      }
      .ctrl-icon {
        font-size: 14px;
      }
      #hourval,
      #animspeedval {
        font-size: 20px;
        font-weight: 600;
        color: #202124;
        letter-spacing: -0.5px;
      }
      #hour,
      #anim-speed {
        width: 100%;
        margin: 0 0 12px;
        accent-color: #1a73e8;
      }

      /* Custom toggle switches */
      .toggle {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        user-select: none;
        font-size: 13px;
        color: #3c4043;
        margin-bottom: 10px;
      }
      .toggle:last-of-type {
        margin-bottom: 0;
      }
      .toggle input[type="checkbox"] {
        appearance: none;
        -webkit-appearance: none;
        width: 34px;
        height: 18px;
        border-radius: 9px;
        background: #bdc1c6;
        position: relative;
        cursor: pointer;
        transition: background 0.2s;
        flex: none;
      }
      .toggle input[type="checkbox"]::after {
        content: "";
        position: absolute;
        width: 14px;
        height: 14px;
        background: #fff;
        border-radius: 50%;
        top: 2px;
        left: 2px;
        transition: transform 0.2s;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      }
      .toggle input[type="checkbox"]:checked {
        background: #1a73e8;
      }
      .toggle input[type="checkbox"]:checked::after {
        transform: translateX(16px);
      }
      .toggle input[type="checkbox"]:disabled {
        background: #e8eaed;
        cursor: not-allowed;
      }

      /* Traffic legend — inline below the traffic toggle */
      .traffic-legend {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: -4px 0 10px 44px;
        color: #5f6368;
        font-size: 11px;
      }
      .bar {
        flex: 1;
        height: 5px;
        border-radius: 3px;
        background: linear-gradient(
          90deg,
          #34a853,
          #f9ab00,
          #ea4335,
          #7f0000
        );
      }

      /* ── Status bar ──────────────────────────────────────────────────── */
      #status-bar {
        position: fixed;
        top: 60px;
        left: 0;
        right: 0;
        z-index: 2;
        padding: 5px 16px;
        background: #f8f9fa;
        border-bottom: 1px solid #f1f3f4;
        font-size: 12px;
        line-height: 1.4;
      }
      #hint {
        color: #5f6368;
        min-height: 17px;
      }
      #modenote {
        color: #9aa0a6;
        font-size: 11px;
        min-height: 15px;
      }

      /* ── Results panel ───────────────────────────────────────────────── */
      #results {
        position: fixed;
        top: 104px;
        left: 14px;
        z-index: 2;
        width: 340px;
        max-height: calc(100vh - 118px);
        display: flex;
        flex-direction: column;
        background: #fff;
        border-radius: 12px;
        box-shadow:
          0 2px 6px rgba(60, 64, 67, 0.3),
          0 6px 20px rgba(60, 64, 67, 0.2);
        overflow: hidden;
      }
      #results.hidden {
        display: none;
      }

      /* Route cards with left color stripe */
      .scroll {
        overflow-y: auto;
      }
      #routes {
        padding: 8px 12px 4px;
      }
      .route-card {
        display: flex;
        flex-direction: column;
        gap: 3px;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1.5px solid transparent;
        cursor: pointer;
        margin-bottom: 4px;
        transition:
          background 0.1s,
          border-color 0.1s;
      }
      .route-card:hover {
        background: #f8f9fa;
      }
      .route-card.sel {
        background: #e8f0fe;
        border-color: #1a73e8;
      }
      .route-card .eta-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .route-card .eta {
        font-size: 18px;
        font-weight: 500;
        color: #188038;
      }
      .route-card .badge {
        font-size: 10px;
        font-weight: 600;
        color: #188038;
        background: #e6f4ea;
        padding: 2px 8px;
        border-radius: 10px;
        white-space: nowrap;
      }
      .route-card .meta {
        font-size: 12px;
        color: #5f6368;
        line-height: 1.4;
      }
      .route-card .meta b {
        color: #3c4043;
        font-weight: 500;
      }

      /* Turn-by-turn steps — collapsible */
      .steps-section[hidden] {
        display: none;
      }
      .steps-toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        padding: 10px 12px;
        background: transparent;
        border: none;
        border-top: 1px solid #f1f3f4;
        cursor: pointer;
        font-family: inherit;
        font-size: 13px;
        font-weight: 500;
        color: #3c4043;
        text-align: left;
      }
      .steps-toggle:hover {
        background: #f8f9fa;
      }
      .steps-toggle .chevron {
        color: #5f6368;
        font-size: 11px;
        transition: transform 0.2s;
      }
      .steps-toggle[aria-expanded="true"] .chevron {
        transform: rotate(180deg);
      }
      #steps {
        padding: 4px 8px 10px;
        overflow: hidden;
        max-height: 2000px;
        transition: max-height 0.2s ease;
      }
      #steps.collapsed {
        padding-top: 0;
        padding-bottom: 0;
        max-height: 0;
      }
      .step {
        display: grid;
        grid-template-columns: 26px 1fr auto;
        align-items: start;
        gap: 8px;
        padding: 9px 8px;
        border-top: 1px solid #f1f3f4;
        font-size: 13px;
      }
      .step .g {
        color: #5f6368;
        font-size: 15px;
        text-align: center;
        line-height: 1.2;
      }
      .step .t {
        color: #3c4043;
      }
      .step .d {
        color: #80868b;
        font-size: 12px;
        white-space: nowrap;
      }

      /* Search animation replay control */
      .anim-row {
        display: flex;
        align-items: center;
      }
      #anim-replay {
        flex: 1;
        padding: 8px 10px;
        cursor: pointer;
        font-size: 12px;
        font-family: inherit;
        background: #f1f3f4;
        color: #3c4043;
        border: none;
        border-radius: 8px;
        white-space: nowrap;
      }
      #anim-replay:hover {
        background: #e8eaed;
      }

      /* Calculate Route button */
      #calc-route {
        flex: none;
        padding: 9px 18px;
        cursor: pointer;
        font-size: 14px;
        font-family: inherit;
        background: #1a73e8;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-weight: 500;
        white-space: nowrap;
        transition:
          background 0.15s,
          opacity 0.15s;
      }
      #calc-route:hover:not(:disabled) {
        background: #1558b0;
      }
      #calc-route:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      /* Footer (inside the results panel) — holds the animation controls */
      .foot {
        padding: 10px 16px 14px;
        border-top: 1px solid #f1f3f4;
      }
      .foot:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="map"></div>

      <header id="toolbar">
        <div class="tb-brand">Route Simulation</div>

        <div id="modes">
          <div class="modes-group">
            <button data-mode="drive" class="active">🚗 Drive</button>
            <button data-mode="walk">🚶 Walk</button>
            <button data-mode="bike">🚲 Bike</button>
          </div>
        </div>

        <div class="tb-fields">
          <span class="dot o"></span>
          <div class="tb-fields-inputs">
            <input
              class="field-input"
              id="origin"
              placeholder="Search or click map to set origin"
              autocomplete="off"
              spellcheck="false"
            />
            <button class="swap-btn" id="swap" title="Swap endpoints">⇅</button>
            <input
              class="field-input"
              id="dest"
              placeholder="Search or click map for destination"
              autocomplete="off"
              spellcheck="false"
            />
          </div>
          <span class="dot d"></span>
        </div>

        <div class="tb-actions">
          <div class="settings-wrap">
            <button id="settings-toggle" class="icon-btn" title="Trip settings">
              ⚙
            </button>
            <div class="settings-panel" id="settings-panel" hidden>
              <div class="time-row">
                <div class="time-label">
                  <span class="ctrl-icon">⏱</span><span>Departure time</span>
                </div>
                <span id="hourval">08:00</span>
              </div>
              <input
                type="range"
                id="hour"
                min="0"
                max="23.5"
                step="0.5"
                value="8"
              />
              <label class="toggle"
                ><input type="checkbox" id="traffic" checked /> Live traffic
                (time-of-day)</label
              >
              <div class="traffic-legend">
                <span>low</span>
                <div class="bar"></div>
                <span>peak</span>
              </div>
              <label class="toggle"
                ><input type="checkbox" id="showtraffic" checked /> Traffic
                overlay</label
              >
              <label class="toggle"
                ><input type="checkbox" id="showplaces" checked /> Places</label
              >
              <label class="toggle"
                ><input type="checkbox" id="keepfrontier" /> Keep search dots
                after animation</label
              >
              <div class="time-row" style="margin-top: 10px">
                <div class="time-label">
                  <span class="ctrl-icon">▶</span
                  ><span>Animation speed</span>
                </div>
                <span id="animspeedval">0.5×</span>
              </div>
              <input
                type="range"
                id="anim-speed"
                min="1"
                max="4"
                step="1"
                value="1"
                style="margin-bottom: 0"
              />
            </div>
          </div>
          <button id="calc-route" disabled>Calculate Route</button>
          <button id="clear" class="icon-btn" title="Clear route">✕</button>
        </div>
      </header>

      <div id="status-bar">
        <div id="hint">Loading map…</div>
        <div id="modenote"></div>
      </div>

      <aside id="results" class="hidden">
        <div class="scroll">
          <div id="routes"></div>
          <div class="steps-section" id="steps-section" hidden>
            <button
              type="button"
              class="steps-toggle"
              id="steps-toggle"
              aria-expanded="false"
            >
              <span id="steps-title">Directions</span>
              <span class="chevron">▾</span>
            </button>
            <div id="steps" class="collapsed"></div>
          </div>
        </div>
        <div class="foot">
          <div class="anim-row" id="anim-controls" style="display: none">
            <button id="anim-replay" title="Replay search animation">
              ↻ Replay search animation
            </button>
          </div>
        </div>
      </aside>
    </div>
    <!-- Fixed-positioned outside #toolbar to escape overflow clipping -->
    <div class="suggestions" id="origin-sugg" hidden></div>
    <div class="suggestions" id="dest-sugg" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
