<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jakarta Router — Directions</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%;
        font-family: 'Roboto', 'Segoe UI', system-ui, Arial, sans-serif;
        color: #202124; background: #e8eaed; }
      #app { position: fixed; inset: 0; }
      #map { position: absolute; inset: 0; cursor: default; }
      .maplibregl-ctrl-attrib { font-size: 10px; }

      /* ── Directions card ─────────────────────────────────────────── */
      #panel { position: fixed; top: 14px; left: 14px; z-index: 2;
        width: 360px; max-height: calc(100vh - 28px); display: flex; flex-direction: column;
        background: #fff; border-radius: 12px;
        box-shadow: 0 1px 3px rgba(60,64,67,.3), 0 4px 12px rgba(60,64,67,.18);
        overflow: hidden; }
      .head { padding: 14px 16px 10px; }
      .head h1 { margin: 0; font-size: 16px; font-weight: 500; }
      .head .sub { color: #5f6368; font-size: 12px; margin-top: 2px; }

      /* mode tabs */
      #modes { display: flex; gap: 4px; padding: 0 12px 8px; }
      #modes button { flex: 1; padding: 8px 0; border: none; background: none; cursor: pointer;
        color: #5f6368; font-size: 13px; border-radius: 8px; border-bottom: 3px solid transparent; }
      #modes button:hover { background: #f1f3f4; }
      #modes button.active { color: #1a73e8; border-bottom-color: #1a73e8; }

      /* origin / destination fields */
      .fields { padding: 4px 16px 10px; }
      .field { display: flex; align-items: center; gap: 10px; padding: 8px 10px;
        background: #f1f3f4; border-radius: 8px; margin-bottom: 6px; font-size: 13px; }
      .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }
      .dot.o { background: #34a853; }
      .dot.d { background: #ea4335; border-radius: 2px; }
      .field .val { color: #3c4043; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .field .val.empty { color: #80868b; }

      /* departure controls */
      .controls { padding: 4px 16px 12px; border-bottom: 1px solid #ebedef; }
      .controls .row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; }
      .controls label { color: #5f6368; }
      #hourval { font-weight: 500; }
      #hour { width: 100%; margin: 8px 0 6px; accent-color: #1a73e8; }
      .toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none;
        font-size: 13px; color: #3c4043; }
      .toggle input { accent-color: #1a73e8; }

      /* scroll area: route cards + steps */
      .scroll { overflow-y: auto; }
      #routes { padding: 8px 12px 4px; }
      .route-card { display: flex; align-items: baseline; gap: 10px; padding: 10px 12px;
        border-radius: 10px; cursor: pointer; border: 1px solid transparent; }
      .route-card:hover { background: #f8f9fa; }
      .route-card.sel { background: #e8f0fe; border-color: #d2e3fc; }
      .route-card .eta { font-size: 18px; font-weight: 500; color: #188038; }
      .route-card.slow .eta { color: #c5221f; }
      .route-card .meta { font-size: 12px; color: #5f6368; line-height: 1.4; }
      .route-card .meta b { color: #3c4043; font-weight: 500; }

      #steps { padding: 4px 8px 10px; }
      .step { display: grid; grid-template-columns: 26px 1fr auto; align-items: start; gap: 8px;
        padding: 9px 8px; border-top: 1px solid #f1f3f4; font-size: 13px; }
      .step .g { color: #5f6368; font-size: 15px; text-align: center; line-height: 1.2; }
      .step .t { color: #3c4043; }
      .step .d { color: #80868b; font-size: 12px; white-space: nowrap; }

      .foot { padding: 10px 16px 14px; }
      .note { color: #80868b; font-size: 11px; line-height: 1.5; margin-bottom: 10px; }
      #clear { width: 100%; padding: 9px; cursor: pointer; font-size: 13px;
        background: #fff; color: #1a73e8; border: 1px solid #dadce0; border-radius: 8px; font-weight: 500; }
      #clear:hover { background: #f8f9fa; }
      .legend { display: flex; align-items: center; gap: 6px; margin: 8px 0 0; color: #5f6368; font-size: 11px; }
      .bar { flex: 1; height: 6px; border-radius: 3px;
        background: linear-gradient(90deg, #34a853, #f9ab00, #ea4335); }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="map"></div>
      <div id="panel">
        <div class="head">
          <h1>Jakarta Router</h1>
          <div class="sub" id="hint">Loading map…</div>
        </div>

        <div id="modes">
          <button data-mode="drive" class="active">🚗 Drive</button>
          <button data-mode="walk">🚶 Walk</button>
          <button data-mode="bike">🚲 Bike</button>
        </div>

        <div class="fields">
          <div class="field"><span class="dot o"></span><span class="val empty" id="origin">Click the map to set origin</span></div>
          <div class="field"><span class="dot d"></span><span class="val empty" id="dest">Then click to set destination</span></div>
        </div>

        <div class="controls">
          <div class="row"><label for="hour">Departure time</label><span id="hourval">08:00</span></div>
          <input type="range" id="hour" min="0" max="23.5" step="0.5" value="8" />
          <label class="toggle"><input type="checkbox" id="traffic" checked /> Live traffic (time-of-day)</label>
          <label class="toggle"><input type="checkbox" id="showplaces" checked /> Places (zoom in to see)</label>
        </div>

        <div class="scroll">
          <div id="routes"></div>
          <div id="steps"></div>
        </div>

        <div class="foot">
          <div class="legend"><span>free</span><div class="bar"></div><span>jam</span></div>
          <div class="note" id="modenote"></div>
          <button id="clear">Clear</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
